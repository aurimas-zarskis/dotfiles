---
- name: Update Homebrew
  homebrew:
    update_homebrew: true

- name: Upgrade Homebrew Packages
  homebrew:
    upgrade_all: true

- name: Tap homebrew
  vars:
    brew_taps:
      - FelixKratz/formulae
      - sdkman/tap
  homebrew_tap:
    name: "{{ brew_taps }}"
    state: present

- name: Install homebrew casks
  vars:
    brew_casks:
      - 1password
      - android-studio-preview@beta
      - brave-browser
      - slack
      - readdle-spark
      - zed
      - ghostty
      - font-jetbrains-mono-nerd-font
      - obsidian
      - nikitabobko/tap/aerospace
      - libreoffice
      - emclient
      - claude-code
      - antigravity-cli
      - android-cli
      - shirkeharsh/tap/mooziac
      - linearmouse
  homebrew_cask:
    name: "{{ brew_casks }}"
    state: present

- name: Install homebrew packages
  vars:
    brew_packages:
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - oh-my-posh
      - fzf
      - git
      - sdkman-cli
      - jq
  homebrew:
    name: "{{ brew_packages }}"
    state: present
