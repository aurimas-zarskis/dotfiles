---
- name: Create symlink for Oh-My-Posh config directory
  ansible.builtin.file:
    src: "{{ playbook_dir }}/files/ohmyposh"
    dest: "{{ ansible_facts['user_dir'] }}/.config/ohmyposh"
    force: true
    state: link

- name: Create symlink for .zshrc file
  ansible.builtin.file:
    src: "{{ playbook_dir }}/files/.zshrc"
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    force: true
    state: link

- name: Create zsh plugins directory
  file:
    path: "{{ ansible_facts['user_dir'] }}/.config/zsh/plugins"
    state: directory
    mode: 0700

#- name: Clone fzf-tab-completion plugin
#  ansible.builtin.git:
#    repo: "https://github.com/lincheney/fzf-tab-completion"
#    dest: "{{ ansible_user_dir }}/.config/zsh/plugins/fzf-tab-completion"

- name: Clone fzf-tab plugin
  ansible.builtin.git:
    repo: "https://github.com/Aloxaf/fzf-tab"
    dest: "{{ ansible_facts['user_dir'] }}/.config/zsh/plugins/fzf-tab"

- name: Ensure zsh paths.d directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/zsh/paths.d"
    state: directory
    mode: '0700'

- name: Remove legacy dotfiles path block from .zshenv
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zshenv"
    marker: "# {mark} Ansible managed block for custom dotfiles.sh script"
    state: absent

- name: Configure .zshenv with modular paths loader
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zshenv"
    create: true
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED PATH LOADER"
    prepend_newline: true
    block: |
      # Deduplicate PATH entries automatically
      typeset -U path PATH

      # Base dotfiles bin
      path=({{ ansible_facts['user_dir'] }}/.dotfiles/bin $path)

      # Source modular path snippets
      for file in "{{ ansible_facts['user_dir'] }}/.config/zsh/paths.d"/*.zsh(N); do
        source "$file"
      done
